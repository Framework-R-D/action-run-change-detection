name: "Run Change Detection"
description: "Encapsulates checkout, detection of relevant changes, and reporting."
inputs:
  checkout-path:
    description: "Path to check out code to"
    required: true
  ref:
    description: "The branch, ref, or SHA to checkout"
    required: true
  sha:
    description: "Immutable source SHA; may be omitted only when ref is already a full SHA"
    required: false
  repo:
    description: "The repository to checkout from"
    required: true
  base-ref:
    description: "The base ref for comparison"
    required: true
  file-type:
    description: "Predefined file type (cpp, python, cmake, jsonnet, yaml, md)"
    required: false
  include-globs:
    description: "Custom include globs"
    required: false
  exclude-globs:
    description: "Custom exclude globs"
    required: false
  head-ref:
    description: "Explicit head ref (defaults to inputs.ref)"
    required: false

outputs:
  has_changes:
    description: "Whether relevant changes were detected"
    value: ${{ steps.filter.outputs.matched }}
  matched_files:
    description: "The list of matched files"
    value: ${{ steps.filter.outputs.matched_files }}

runs:
  using: "composite"
  steps:
    - name: Validate immutable detection target
      id: target
      shell: bash
      env:
        INPUT_SHA: ${{ inputs.sha || inputs.ref }}
        INPUT_HEAD: ${{ inputs.head-ref }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_PATH: ${{ inputs.checkout-path }}
      run: |
        python3 - <<'PY'
        import os
        import re
        import subprocess
        from pathlib import Path
        sha = os.environ['INPUT_SHA']
        if not re.fullmatch(r'[0-9a-f]{40}', sha) or sha == '0' * 40:
            raise SystemExit('Change detection requires a full immutable source SHA')
        if os.environ['INPUT_HEAD'] and os.environ['INPUT_HEAD'] != sha:
            raise SystemExit('Detection head must match the checkout snapshot')
        repo = os.environ['INPUT_REPO']
        if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+', repo) or repo.split('/')[1] in ['.', '..']:
            raise SystemExit('Invalid repository')
        value = os.environ['INPUT_PATH']
        path = Path(value)
        root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        if not value or path.is_absolute() or any(part in ['', '.', '..'] for part in value.split('/')) or any(ord(c) < 32 for c in value):
            raise SystemExit('Invalid checkout path')
        if not (root / path).resolve().is_relative_to(root):
            raise SystemExit('Checkout path escapes workspace')
        version = subprocess.run(['git', '--version'], check=True, capture_output=True, text=True).stdout
        match = re.search(r'(\d+)\.(\d+)', version)
        if not match or tuple(map(int, match.groups())) < (2, 25):
            raise SystemExit('Git 2.25 or newer is required for sparse checkout')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'sha={sha}\n')
        PY
    # Git-only analysis does not run target code. The nonempty exclusion pattern is
    # essential: actions/checkout treats an empty sparse-checkout input as a full checkout.
    # This rationale is audit evidence, not an inline CodeQL suppression.
    - name: Check out source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        path: ${{ inputs.checkout-path }}
        ref: ${{ steps.target.outputs.sha }}
        repository: ${{ inputs.repo }}
        persist-credentials: false
        # Use empty sparse checkout so no PR files are materialized in the working
        # tree — only git objects are needed for diff and ls-tree operations.
        sparse-checkout-cone-mode: false
        sparse-checkout: "!/*"

    - name: Detect relevant changes
      id: filter
      uses: Framework-R-D/action-detect-relevant-changes@6ede78eec7af8d0e271a2bd2bd8b08f8a7bc9cba # v1
      with:
        repo-path: ${{ inputs.checkout-path }}
        base-ref: ${{ inputs.base-ref }}
        head-ref: ${{ steps.target.outputs.sha }}
        file-type: ${{ inputs.file-type }}
        include-globs: ${{ inputs.include-globs }}
        exclude-globs: ${{ inputs.exclude-globs }}

    - name: Report detection outcome
      shell: bash
      env:
        FILTER_MATCHED: ${{ steps.filter.outputs.matched }}
        FILTER_MATCHED_FILES: ${{ steps.filter.outputs.matched_files }}
        INPUT_FILE_TYPE: ${{ inputs.file-type }}
      run: |
        if [ "${FILTER_MATCHED}" != "true" ]; then
          echo "::notice::No relevant changes detected; job will be skipped."
        else
          echo "::group::Relevant files detected"
          stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          while [[ "$FILTER_MATCHED_FILES" == *"$stop_token"* ]]; do
            stop_token="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          done
          echo "::stop-commands::$stop_token"
          printf '%s\n' "${FILTER_MATCHED_FILES}"
          echo "::$stop_token::"
          echo "::endgroup::"
        fi
